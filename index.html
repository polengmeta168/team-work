<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleShop - Home</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

   <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            StyleShop
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="shop.html">Shop</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Wishlist</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Account</a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- Hero -->
<section class="hero py-5">
    <div class="container text-center">

        <h1 class="display-4 fw-bold">
            Welcome to StyleShop
        </h1>

        <p class="lead">
            Find your style. Feel confident.
        </p>

        <a href="shop.html" class="btn btn-primary">
            Shop Now
        </a>

    </div>
</section>


<!-- Categories -->
<section class="py-5">

    <div class="container">

        <h2 class="text-center mb-4">
            Our Categories
        </h2>

        <div class="row g-4">

            <div class="col-md-6">
                <div class="card text-center p-4">
                    <i class="bi bi-watch fs-1"></i>

                    <h4 class="mt-3">Watches</h4>

                    <p>
                        Discover stylish watches for your everyday look.
                    </p>

                    <a href="shop.html" class="btn btn-dark">
                        View Watches
                    </a>
                </div>
            </div>


            <div class="col-md-6">
                <div class="card text-center p-4">

                    <i class="bi bi-sunglasses fs-1"></i>

                    <h4 class="mt-3">Sunglasses</h4>

                    <p>
                        Choose modern sunglasses for your style.
                    </p>

                    <a href="shop.html" class="btn btn-dark">
                        View Sunglasses
                    </a>

                </div>
            </div>

        </div>

    </div>

</section>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
